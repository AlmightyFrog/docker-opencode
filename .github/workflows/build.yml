name: opencode build

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths-ignore: &ignore-rules ['**.md', 'docs/**', '.gitignore', 'LICENSE', 'install.sh', 'opencode-live.sh', 'opencode-share.sh', 'opencode-update.sh']
  pull_request:
    branches: [main, dev]
    paths-ignore: *ignore-rules
  schedule:
    - cron: '23 1 * * 0'

jobs:
  build:
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      packages: write
    uses: AlmightyFrog/workflow-templates/.github/workflows/docker-build.yml@v1
